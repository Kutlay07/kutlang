[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "kutlang"
version = "0.1.0"
description = "Coding agent harness."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "pytest",
    "transformers",
    "llama-cpp-python",
    "openai",
    "fastapi[standard]",
]


[project.entry-points."harness.tools"]
filesystem = "harness.tools.filesystem.provider:FilesystemToolProvider"
execution = "harness.tools.execution.provider:ExecutionToolProvider"


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]

markers = [
    "slow: expensive tests",
]

addopts = "-m 'not slow'"