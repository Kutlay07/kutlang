name: Tests

on:
    push:
        branches:
            - main
            - "feature/**"

    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install project
              run: pip install -e .

            - name: Run normal tests
              run: python -m pytest

            - name: Run slow tests
              run: python -m pytest -m slow